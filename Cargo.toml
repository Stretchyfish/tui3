[package]
name = "tui3"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
crossterm = "0.29"
futures-util = { version = "0.3.34", features = ["sink"] }
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "time", "macros", "process", "sync"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
uuid = { version = "1.29.3", features = ["v4"] }
unicode-width = "0.2"
unicode-segmentation = "1"
